name: Deploy Backend to EC2

on:
  push:
    branches: [ "main" ] # Hoặc "master" tùy tên nhánh chính của bạn

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tên ảnh phải KHỚP với tên trong file docker-compose.yml trên server
          tags: huyhoang2609/mini-e-backend:latest

  deploy-to-ec2:
    needs: build-and-push # Chờ build xong mới deploy
    runs-on: ubuntu-latest
    steps:
      - name: SSH Remote Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Vào thư mục dự án trên server (đã tạo ở bước trước)
            cd ~/my-project
            
            # 2. Kéo ảnh backend mới nhất về
            docker compose pull backend
            
            # 3. Tạo lại container backend (Frontend và Database vẫn chạy bình thường)
            docker compose up -d backend
            
            # 4. Dọn dẹp ảnh cũ cho đỡ tốn dung lượng
            docker image prune -f
